[byild-system]
required = ["hatching>=1.26"]
build-backend = ["hatching.build"]

[project]
name = "junior-python-developer"
version = "0.1.0"
description = "Add your description here"
author = [
    {name="Nikolay Zuev"},
    ]
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[tool.hatch.build]
include = ["src/*.py"]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
]

[tool.black]
line-length = 79
target-version = ["py310"]
extend-exclude = """
(
    .venv
)
"""

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --strict-markers --cov=src --cov-report=html"
markers = [
    "unit: Все unit-тесты",
    "smoke: Дымовые тесты для критического функционала",
    "regression: Полный набор регрессионных тестов",
    "slow: Медленные тесты"
]

[tool.uv.workspace]
members = [
    ".",
]